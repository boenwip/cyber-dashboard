    <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false"><span class="bars"></span></button>

    <img src="assets/pseudosec.png" alt="pseudosec." width="74" height="34">

  <div class="hdr-right">
    <span class="hdr-meta" id="last-updated"></span>
    <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
  </div>

<main class="dash" id="main">
  <h1 class="visually-hidden">pseudosec. — Australian cyber security dashboard</h1>

  <!-- OVERVIEW: each panel opens the explorer at its topic -->
  <div class="bento" id="overview">
    <button type="button" class="panel p-count" data-go="year">
      <span class="lbl"><span>Estimated cybercrime reports this financial year</span><em id="fy-label">FY</em></span>
      <span class="big" id="main-count">—</span>
      <span class="count-sub" id="report-interval"></span>
      <span class="ruler" aria-hidden="true"><span class="fill" id="fy-fill"></span><span class="here" id="fy-here"></span></span>
      <span class="fy-scale"><span>1 Jul</span><span id="fy-day"></span><span>30 Jun</span></span>
      <span class="cue">How it's counted</span>
    </button>

    <button type="button" class="panel p-alert" data-go="alerts">
      <span class="lbl"><span>Official alert</span><em id="alert-meta">ACSC</em></span>
      <span id="alert-chip"></span>
      <span class="ttl" id="alert-title">Loading…</span>
      <span class="cue">All ACSC alerts</span>
    </button>

    <button type="button" class="panel p-cve" data-go="cve">
      <span class="lbl"><span>Exploited this week</span></span>
      <span class="mid" id="cve-count">—</span>
      <span class="small" id="cve-sub">vulnerabilities added to CISA's list</span>
      <span class="cue">See all</span>
    </button>

    <button type="button" class="panel p-scam" data-go="scams">
      <span class="lbl"><span>Scam to know</span><em id="scam-src"></em></span>
      <span class="ttl" id="scam-title">Loading…</span>
      <span class="cue">Scams this week</span>
    </button>

    <button type="button" class="panel p-news" data-go="news">
      <span class="lbl"><span>Latest news</span><em id="news-count"></em></span>
      <span class="nl" id="news-preview"><span class="small">Loading…</span></span>
      <span class="cue">All stories</span>
    </button>

    <button type="button" class="panel p-crime" data-go="year" data-pick="2">
      <span class="lbl"><span>Most reported · individuals</span></span>
      <span class="bars" id="crime-bars"></span>
      <span class="cue">Breakdown</span>
    </button>

    <button type="button" class="panel p-tip" data-go="learn">
      <span class="lbl"><span>Tip of the day</span></span>
      <span class="ttl" id="tip-text"></span>
      <span class="cue">More tips</span>
    </button>

    <button type="button" class="panel p-tools" data-go="tools">
      <span class="lbl"><span>Tool updates</span></span>
      <span class="tl" id="tools-preview"><span class="small">Loading…</span></span>
      <span class="cue">All updates</span>
    </button>

    <button type="button" class="panel p-wotd" data-go="learn" data-pick="1">
      <span class="lbl"><span>Word of the day</span></span>
      <span class="ttl"><b id="wotd-term"></b> <span id="wotd-def"></span></span>
      <span class="cue">Glossary</span>
    </button>
  </div>

  <!-- EXPLORER: list on the left, detail on the right -->
  <section class="explore" id="explore" hidden aria-labelledby="explore-title">
    <h2 class="visually-hidden" id="explore-title">Explore</h2>
    <div class="ex-top">
      <button type="button" class="back" id="back">Overview</button>
      <div class="tabs" role="tablist" aria-label="Topics" id="tabs"></div>
    </div>
    <div class="split">
      <div class="list" id="list" aria-label="Items"></div>
      <article class="pane" id="pane" aria-live="polite"></article>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span>pseudosec. · Australian cyber security, for anyone · <a href="sources.html">Sources &amp; methodology</a> · <a href="https://github.com/boenwip/cyber-dashboard" target="_blank" rel="noopener noreferrer">GitHub</a></span>
  <span id="footer-updated"></span>
</footer>

<script src="definitions.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
