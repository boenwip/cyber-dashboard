name: Fetch Cyber News

# Cron is UTC. Windows are chosen to cover Sydney time in both AEST (UTC+10)
# and AEDT (UTC+11):
#   Weekdays 8am–6:30pm Sydney  → every 30 min, 21:00–08:30 UTC
#   Weekends (Sat + Sun Sydney) → every 8 hours
on:
  schedule:
    - cron: '0,30 21-23 * * 0-4'   # Mon–Fri early morning, Sydney
    - cron: '0,30 0-8 * * 1-5'     # Mon–Fri daytime, Sydney
    - cron: '0 */8 * * 6,0'        # Weekends
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser pytest

      - name: Test pipeline
        run: python -m pytest -q tests

      - name: Run fetch script
        run: python scripts/fetch_cyber_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/tool_updates.json data/cve.json data/briefing.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update feeds [$(TZ='Australia/Sydney' date '+%d-%m-%Y %H:%M %Z')]"
          # Rebase onto anything pushed since checkout rather than force-pushing.
          git pull --rebase origin main
          git push origin HEAD:main
